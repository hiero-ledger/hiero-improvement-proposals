name: Validate HIP

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ValidateHIP:
    runs-on: hiero-improvement-proposals-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Test HIP validator
        run: npm test

      - name: Validate HIPs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"

          HIP_FILES=()
          while IFS= read -r -d '' FILE; do
            HIP_FILES+=("$FILE")
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" -- ':(glob)HIP/*.md')

          if (( ${#HIP_FILES[@]} == 0 )); then
            echo "No added or modified HIP files to validate."
            exit 0
          fi

          node scripts/validateHIP.js --base-ref "$BASE_SHA" "${HIP_FILES[@]}"
