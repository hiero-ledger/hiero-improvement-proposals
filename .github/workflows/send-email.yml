name: Send status email
on:
  workflow_dispatch:
     inputs:
       filename:
         description: "Filename"
         type: string
         required: true
       status:
         description: "Status"
         type: string
         required: true
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  StatusChangeNotifications:
    runs-on: hiero-improvement-proposals-linux-medium
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Send mail
        uses: step-security/action-send-mail@3f790374886b81c73df037c6d01c11b76981d67a # v24.0.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: hips@hedera.com
          password: ${{ secrets.GOOGLE_APP_PASS }}
          subject: ${{ github.event.inputs.filename }} moved into ${{ github.event.inputs.status }}
          to: ${{ secrets.LAST_CALL_EMAILS }}
          from: The HIPs repository
          body: This is an automated message, please do not reply. Check https://hips.hedera.com/hip/${{ github.event.inputs.filename }} for more info. Thank you.
          secure: true
          priority: medium